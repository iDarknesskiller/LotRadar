<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LotRadar Reader</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#10161d;color:#ecf2f8}
body{margin:0;width:332px;padding:16px;box-sizing:border-box}
h1{font-size:19px;margin:0}header,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
section{background:#18222d;border:1px solid #2c3b4a;border-radius:10px;padding:12px;margin-top:12px}
p{margin:7px 0;line-height:1.42;color:#c3cfdd}small{color:#9db0c5}
button,input{font:inherit;border:1px solid #40566a;border-radius:7px;padding:8px;background:#223342;color:inherit}
button{cursor:pointer}button:hover{background:#2e4558}button:disabled{opacity:.5;cursor:default}
input{display:block;box-sizing:border-box;width:100%;margin:7px 0}
strong[data-state="connected"]{color:#85e4bf}strong[data-state="offline"]{color:#ffb990}
form,.actions{margin-top:10px}.actions{display:grid;gap:7px}.primary{background:#124c45;border-color:#388b79}
#message:empty{display:none}[hidden]{display:none!important}
</style></head><body>
<header><h1>LotRadar Reader</h1><small id="version"></small></header>
<section aria-label="Connection">
  <div class="row"><strong id="connection" role="status">Checking connection…</strong><button id="retry" type="button">Reconnect</button></div>
  <p id="connection-detail"></p>
  <button id="change" type="button" hidden>Change pairing</button>
  <form id="pairing" hidden>
    <label for="key">Pairing key from LotRadar Settings</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" required>
    <button class="primary" id="save" type="submit">Connect</button>
  </form>
</section>
<div class="actions" id="actions" hidden>
  <button type="button" class="primary" id="fill-vehicle-form" hidden>Fill vehicle form</button>
  <button type="button" id="run">Check dealer scan queue</button>
  <button type="button" id="capture-facebook">Capture current Facebook listing</button>
  <button type="button" id="enable-facebook-auto">Enable automatic Facebook checks</button>
</div>
<p id="message" role="status"></p>
<script src="popup.js"></script></body></html>
